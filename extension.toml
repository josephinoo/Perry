[commands.paredit-insert-quote]
title = "Perry: Paredit Insert Double Quote"

[commands.paredit-comment-shunting]
title = "Perry: Paredit Comment Shunting"

[[capabilities]]
kind = "network:tcp-local"
host = "127.0.0.1"

[[capabilities]]
kind = "network:tcp-local"
host = "localhost"

[[capabilities]]
kind = "process:exec"
command = "clojure"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "lein"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "bb"
args = ["**"]

[[capabilities]]
kind = "process:exec"
command = "npx"
args = ["**"]
