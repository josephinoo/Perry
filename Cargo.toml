[package]
name = "perry"
version = "0.1.0"
edition = "2021"
description = "Clojure interactive development and nREPL support for Zed"

[lib]
path = "src/perry.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
zed_extension_api = { path = "/Volumes/Workspace/Projects/zed/crates/extension_api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
